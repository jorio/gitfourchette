name: Test on Windows

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - run: |
        Get-Command git
        Get-Command gpg
        git version
        gpg --version

    - uses: actions/setup-python@v7
      with: {python-version: '3.15', cache: 'pip'}

    - run: pip install -e .[pyqt6,test,mfusepy]
    - run: python3 test.py --with-network -v
    - run: python3 test.py --with-network -v -1 -m notParallelizableOnWindows
