name: Builds

on:
  workflow_dispatch:
  workflow_call:

env:
  PYVER: "3.14"
  QT_API: "PyQt6"

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        platform:  # Use oldest available Ubuntu for maximum glibc compatibility
          - { name: x86_64, os: ubuntu-22.04 }
          - { name: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYVER }}" }
      - run: python -m pip install --upgrade pip setuptools wheel pygit2  # build dependencies
      - run: python -m pip install --upgrade git+https://github.com/niess/python-appimage@6807bbd
      - run: sudo apt update
      - run: mkdir qt_extrastuff
      - name: Detect Qt runtime version (for install-qt-action)
        run: |
          pip install $QT_API
          python -c "from $QT_API.QtCore import qVersion; print('QT_RUNTIME_VERSION='+qVersion())" >> $GITHUB_ENV
      - name: Install Qt to build QAdwaitaDecorations
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.QT_RUNTIME_VERSION}}
          dir: ${{ github.workspace }}/qt6
          setup-python: false
          cache: true
      - name: Build QAdwaitaDecorations (for DEs like GNOME that expect client-side decorations)
        run: |
          echo QT_ROOT_DIR appears to be $QT_ROOT_DIR
          sudo apt install libwayland-dev libvulkan-dev libopengl0
          git clone https://github.com/FedoraQt/QAdwaitaDecorations
          cd QAdwaitaDecorations
          git checkout 440d4b0
          cmake -S . -B build -DUSE_QT6=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel
          cmake --install build --prefix "$GITHUB_WORKSPACE/qt_extrastuff"
          mkdir "$GITHUB_WORKSPACE/gl_fallback"
          cp -a /usr/lib/`dpkg-architecture -qDEB_HOST_MULTIARCH`/libOpenGL.so.0* "$GITHUB_WORKSPACE/gl_fallback"
      - name: Build libxcb-cursor (AppImage catalog requirement)
        run: |
          sudo apt install autoconf xutils-dev libtool libxcb-render0-dev libxcb-render-util0-dev libxcb-image0-dev gperf
          git clone --recursive https://gitlab.freedesktop.org/xorg/lib/libxcb-cursor.git
          cd libxcb-cursor
          git checkout --recurse-submodules ed42261d
          ./autogen.sh --prefix=/ --disable-static
          make
          make DESTDIR="$GITHUB_WORKSPACE/qt_extrastuff" install
      - name: Build AppImage
        run: |
          PYVER=$PYVER QT_API=$QT_API QT_EXTRASTUFF="$GITHUB_WORKSPACE/qt_extrastuff" GL_FALLBACK="$GITHUB_WORKSPACE/gl_fallback" ./pkg/appimage/build-appimage.sh
          echo "ARTIFACT_NAME=$(cd build && ls GitFourchette*.AppImage)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          path: build/GitFourchette*.AppImage
          name: ${{env.ARTIFACT_NAME}}
          archive: false

  pyinstaller:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-latest }
          - { os: windows-2022 }
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYVER }}" }
      - run: python --version
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install --upgrade -e .[$QT_API,mfusepy]  # install dependencies (installing GF itself isn't strictly necessary)
      - run: python .github/workflows/artifactname.py >> $GITHUB_ENV
      - run: python -m pip install --upgrade pyinstaller
      - run: python -m PyInstaller pkg/pyinstaller/gitfourchette.spec
      # upload-artifact has trouble with symlinks, use ditto to zip up the app
      - if: ${{ runner.os == 'macOS' }}
        run: |
          ditto -c -k --keepParent dist/GitFourchette.app application.zip
          rm -rf dist/*
          mv application.zip dist/${{env.ARTIFACT_NAME}}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: dist
          archive: ${{ runner.os != 'macOS' }}  # pre-zipped on macOS
