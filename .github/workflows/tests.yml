name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      # Keep names in sync with testmatrix.py
      "linux-312-pyqt5-old": {type: boolean, default: false}
      "linux-312-pyqt6-old": {type: boolean, default: false}
      "linux-313-pyqt6"    : {type: boolean, default: false}
      "linux-314-pyqt6"    : {type: boolean, default: false}
      "linux-315-pyqt6-cov": {type: boolean, default: true}
      "linux-315-pyside6"  : {type: boolean, default: false}
      "macos-315-pyqt6"    : {type: boolean, default: false}
      "win32-315-pyqt6"    : {type: boolean, default: false}
  push:
    branches-ignore: ['temp/**']
    paths-ignore: ['**.md', '**.po', '**.pot']

defaults:
  run:
    shell: bash  # for Windows

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    env:
      WORKFLOW_INPUTS: ${{ toJson(inputs) }}
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: '.github/'}
      - id: set
        run: python .github/workflows/testmatrix.py >> "$GITHUB_OUTPUT"

  ruff-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: 3.15, cache: 'pip'}
      - run: pip install 'pyqt6<6.12'  # QtGui.pyi from PyQt6 6.12 causes mypy errors as of 10/2026
      - run: pip install -e .[lint,pyqt6]
      - run: ruff check
      - run: mypy
        if: '!cancelled()'  # run mypy even if ruff failed above

  tests:
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v7

    - name: APT
      if: ${{ runner.os == 'Linux' }}
      run: ${{ matrix.apt-command }}

    - name: Git version
      run: |
        which git
        git version
        git lfs version 2>/dev/null || echo '*** LFS not available on this runner ***'
        which gpg
        gpg --version

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.py }}
        cache: 'pip'

    - run: ${{ matrix.pip-command }}

    - run: ${{ matrix.test-command }} -1 -m notParallelizableOnWindows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh  # win32ctrlc interferes with other shells

    - run: ${{ matrix.test-command }}

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: ${{ matrix.coverage }}
      with:
        path: coverage_html_report
        name: coverage_run${{ github.run_number }}_${{ matrix.name }}
