name: Tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['master', 'next']
    paths-ignore: ['**.md', '**.po', '**.mo', '**.pot']

jobs:
  ruff-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: 3.15, cache: 'pip'}
      - run: pip install 'pyqt6<6.12'  # QtGui.pyi from PyQt6 6.12 causes mypy errors as of 10/2026
      - run: pip install -e .[lint,pyqt6]
      - run: ruff check
      - run: mypy
        if: '!cancelled()'  # run mypy even if ruff failed above

  tests:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        # Legacy config with no optional dependencies, ancient pygit2 and pygments, and old Git
        - {name: '312-pyqt5-legacy', os: ubuntu-22.04, py: '3.12', qt: pyqt5, downgrade-git: true, skip-fuse: true,
           pre-pip: 'pip install pygit2==1.14.1 pygments==2.12', post-pip: 'pip uninstall -y mfusepy'}
        # Legacy config with old PyQt6 and non-cutting-edge Git
        - {name: '312-pyqt6.5', os: ubuntu-24.04, py: '3.12', qt: pyqt6, downgrade-git: true,
           pre-pip: 'pip install "pyqt6<6.6" "pyqt6-qt6<6.6" "pyqt6-sip<13.7" pytest-qt==4.3.1'}
        # Semi-legacy configs
        - {name: '313-pyqt6', os: ubuntu-latest, py: '3.13', qt: pyqt6, downgrade-git: true}
        - {name: '314-pyqt6', os: ubuntu-latest, py: '3.14', qt: pyqt6}
        # Up-to-date configs
        - {name: '315-pyqt6', os: ubuntu-latest, py: '3.15', qt: pyqt6, coverage: true}
        - {name: '315-pyside6', os: ubuntu-latest, py: '3.15', qt: pyside6}
        # Use Intel Mac runner because ARM runners are scarce on GHA at the moment (11/2026)
        - {name: '315-pyqt6-mac', os: macos-26-intel, py: '3.15', qt: pyqt6, skip-fuse: true}

    steps:
    - uses: actions/checkout@v7

    - name: Qt dependencies
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install ${{ matrix.qt == 'pyqt5' && 'libqt5gui5' || 'libqt6gui6' }}

    - name: Downgrade git
      if: ${{ matrix.downgrade-git }}
      run: |
        sudo apt remove git git-man
        sudo apt install git

    - name: Git version
      run: |
        which git
        git version
        git lfs version 2>/dev/null || echo '*** LFS not available on this runner ***'
        which gpg
        gpg --version

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.py }}
        cache: 'pip'

    - name: pip
      run: |
        ${{ matrix.pre-pip }}
        pip install -e .[${{ matrix.qt }},test,mfusepy]
        ${{ matrix.post-pip }}
        pip list --local

    - run: ./test.py -v --qt=${{ matrix.qt }} --with-network ${{ matrix.skip-fuse && ' ' || '--with-fuse' }} ${{ matrix.coverage && '--cov' }}

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: ${{ matrix.coverage }}
      with:
        path: coverage_html_report
        name: coverage_${{ matrix.name }}_${{ github.sha }}
